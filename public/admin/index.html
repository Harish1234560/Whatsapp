<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marketing Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="login" class="login hidden">
    <form id="login-form" class="card login-card">
      <h1>Marketing Dashboard</h1>
      <p class="muted">Sign in with your admin account.</p>
      <label>Email <input type="email" name="email" autocomplete="username" required></label>
      <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
      <p id="login-error" class="error" role="alert"></p>
      <button class="btn primary" type="submit">Sign in</button>
    </form>
  </div>

  <div id="shell" class="shell hidden">
    <aside class="sidebar">
      <div class="brand">📣 Marketing</div>
      <nav id="nav">
        <a href="#/dashboard">Dashboard</a>
        <a href="#/campaigns">Campaigns</a>
        <a href="#/birthday">🎂 Birthday</a>
        <a href="#/festivals">🎉 Festivals</a>
        <a href="#/top10">🏆 Top 10</a>
        <a href="#/coupons">Coupons</a>
        <a href="#/messages">Messages</a>
        <a href="#/customers">Customers</a>
        <a href="#/settings">Settings</a>
      </nav>
      <div class="sidebar-foot">
        <div id="whoami" class="muted small"></div>
        <button id="logout" class="btn small">Sign out</button>
      </div>
    </aside>
    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true"><div class="modal-box card" id="modal-box"></div></div>
  <div id="toast" class="toast hidden" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
